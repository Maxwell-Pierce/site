name: Refresh artist catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - catalog-source.json
      - .artist-core
      - .github/workflows/catalog.yml
  schedule:
    - cron: '7 6 * * *'
permissions:
  contents: write
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          submodules: true
      - uses: ./.artist-core/actions/refresh
